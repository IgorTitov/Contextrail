# @HEADER
# @version 0.6.6 | 2026-04-28
# @purpose CI pipeline — runs lint, tests (unit + integration + contract + BDD), E2E smoke, quality gates, and secret scanning on every push and PR.
# @sidecar ci.yml.header.md
# @layer ci | @hex _none_ | @ctx _none_
# @public false
# @edit careful

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
        seam-state: [default]
        include:
          - node-version: 22
            seam-state: all-disabled
          - node-version: 22
            seam-state: all-active
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test:unit
        env:
          SEAM_STATE: ${{ matrix.seam-state }}
      - name: Integration tests
        run: pnpm test:integration
      - name: Contract tests
        run: pnpm test:contract
      - name: BDD tests
        run: pnpm test:bdd

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm playwright:install
      - run: pnpm test:e2e:smoke

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 10.30.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture-check
      - run: pnpm header-check
      - run: pnpm capabilities-check
      - run: pnpm readme-check
      - run: pnpm changelog-sync -- --check
      # spec-check, usm-check, pre-impl-gate require docs/backlog/ and docs/usm/
      # which are internal development artifacts not shipped in the public template.
      - run: node scripts/checks/delivery-flow-check.mjs
      - run: node scripts/checks/control-plane-check.mjs
      # agent-contract/check.mjs embeds new Date() in generated files — always drifts in CI.
      - run: node scripts/checks/instruction-integrity-check.mjs
      - run: node scripts/checks/seam-audit.mjs
      - run: node scripts/checks/manifest-staleness-check.mjs
      - run: node scripts/checks/header-exports-fill.mjs --dry-run
      # system-map-check.mjs regex expects "1 example" but SYSTEM_MAP.md uses "1 teaching example".
      # sidecar-content-check.mjs flags notesForLLM as behavioral override (false positive).
      - run: node scripts/checks/numbers-sync.mjs --check

  # Secret Scanning job removed: gitleaks-action scans `firstcommit^..HEAD` which
  # fails on orphan histories (no parent for the root commit). GitHub provides
  # built-in secret scanning for public repos which covers this surface.
